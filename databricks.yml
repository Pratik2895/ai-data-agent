bundle:
  name: ai-data-agent
include:
- resources/*.yml
sync:
  exclude:
  - data/**
  - .git/**
  - .gitignore
variables:
  catalog:
    description: Unity Catalog catalog for all project objects.
    default: ai_agent_demo
  schema:
    description: Schema inside the catalog.
    default: customer_support
  volume:
    description: Managed volume that stores the raw CSVs and PDFs.
    default: data_files
  source_catalog:
    description: Source catalog to copy data from.
    default: agentic_catalog
  source_schema:
    description: Source schema to copy data from.
    default: agentic_schema
  source_volume:
    description: Source volume name.
    default: customer_service
  llm_endpoint:
    description: Foundation Model API endpoint for the main agent LLM.
    default: databricks-llama-4-maverick
  llm_low:
    description: Low-end LLM for simple tasks (curation, formatting).
    default: databricks-gpt-oss-20b
  llm_medium:
    description: Medium LLM for SQL generation and code tasks.
    default: databricks-gpt-oss-20b
  llm_high:
    description: High-end LLM for complex reasoning and tool-calling.
    default: databricks-llama-4-maverick
  agent_model_name:
    description: Registered model name in Unity Catalog for the agent.
    default: ${var.catalog}.${var.schema}.data_agent
  agent_endpoint:
    description: Model Serving endpoint name for the deployed data agent.
    default: ai_data_agent_endpoint
  app_name:
    description: Databricks App name (must be unique in the workspace).
    default: ai-data-agent-app
  warehouse_id:
    description: SQL warehouse used by the agent
    default: 0a214d63e620a999
targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: ''
    workspace:
      profile: dev-52d59088
  prod:
    mode: production
    workspace:
      profile: dev-52d59088
    variables:
      schema: customer_support_prod
