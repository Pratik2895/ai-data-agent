resources:
  apps:
    ai_data_agent_app:
      name: ${var.app_name}
      description: AI Data Agent chat interface
      resources:
      - name: agent-endpoint
        serving_endpoint:
          name: ${var.agent_endpoint}
          permission: CAN_QUERY
      git_repository:
        url: https://github.com/Pratik2895/ai-data-agent.git
        provider: gitHub
      git_source:
        branch: codex/complete-data-agent
        source_code_path: src/app
